; ==============================================================================
; SizerAlternative Konfigurationsdatei
; ==============================================================================

[Settings]
; Tastenkombination zum Öffnen des Menüs (^ = Strg, # = Win, ! = Alt, + = Umschalt)
Hotkey=^#z

; Menü per Mittelklick auf die Fenstertitelleiste öffnen (1 = Ein, 0 = Aus)
MiddleClickTitleBar=1

; Menü per Strg + Rechtsklick auf ein beliebiges Fenster öffnen (1 = Ein, 0 = Aus)
CtrlRightClick=1

; Unsichtbare Fensterrahmen von Windows 10/11 ausgleichen (1 = Ja, 0 = Nein)
; Sorgt für pixelgenaue Übereinstimmung mit den gewählten Presets.
CompensateBorders=1

[Presets]
Item1=123|1308|858|fixed|866|343
Item2=1920 x 1080 (Full HD, Zentriert)|1920|1080|center|0|0
Item3=1600 x 900 (HD+, Zentriert)|1600|900|center|0|0
Item4=1280 x 720 (HD 720p, Zentriert)|1280|720|center|0|0
Item5=1024 x 768 (XGA, Zentriert)|1024|768|center|0|0
Item6=800 x 600 (SVGA, Zentriert)|800|600|center|0|0
